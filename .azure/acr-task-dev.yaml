version: v1.1.0
steps:
  - build: >-
      -t {{.Run.Registry}}/forecast-frontend-dev:{{.Run.ID}}
      -t {{.Run.Registry}}/forecast-frontend-dev:latest
      --build-arg NEXT_PUBLIC_API_BASE_URL={{.Values.NEXT_PUBLIC_API_BASE_URL}}
      -f Dockerfile .
  - push:
      - "{{.Run.Registry}}/forecast-frontend-dev:{{.Run.ID}}"
      - "{{.Run.Registry}}/forecast-frontend-dev:latest"
