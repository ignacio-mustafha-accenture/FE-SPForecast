version: v1.1.0
steps:
  - build: >-
      -t {{.Run.Registry}}/forecast-frontend-dev:{{.Run.ID}}
      -t {{.Run.Registry}}/forecast-frontend-dev:latest
      --build-arg NEXT_PUBLIC_API_BASE_URL={{.Values.NEXT_PUBLIC_API_BASE_URL}}
      -f Dockerfile .
  - push:
      - "{{.Run.Registry}}/forecast-frontend-dev:{{.Run.ID}}"
      - "{{.Run.Registry}}/forecast-frontend-dev:latest"
  - cmd: >-
      mcr.microsoft.com/azure-cli:latest
      bash -c "az login --identity &&
      az containerapp update
      --name forecast-frontend-dev
      --resource-group rg-forecast-dev
      --image {{.Run.Registry}}/forecast-frontend-dev:{{.Run.ID}}"
    identity: "[system]"
