version: v1.1.0
steps:
  - build: >-
      -t {{.Run.Registry}}/forecast-frontend-prod:{{.Run.ID}}
      -t {{.Run.Registry}}/forecast-frontend-prod:latest
      --build-arg NEXT_PUBLIC_API_BASE_URL={{.Values.NEXT_PUBLIC_API_BASE_URL}}
      -f Dockerfile .
  - push:
      - "{{.Run.Registry}}/forecast-frontend-prod:{{.Run.ID}}"
      - "{{.Run.Registry}}/forecast-frontend-prod:latest"
